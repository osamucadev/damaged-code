# Development containers install a filtered subset of the workspace inside the
# image, so pnpm's pre-run check would consider the modules directory out of
# sync and try to purge it, which fails without a TTY. "warn" keeps the signal
# for developers on the host while letting the containers start.
verifyDepsBeforeRun: warn

packages:
  - "apps/*"
  - "packages/*"

# Dependencies explicitly allowed to run install scripts.
allowBuilds:
  esbuild: true
  # Firebase CLI dependencies, used by the emulator image.
  protobufjs: true
  re2: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - eslint-config-next@16.3.6
  - jsdom@30.1.1
  - next@16.3.6
